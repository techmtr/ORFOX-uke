name: Build OrangeFox Recovery for Xiaomi Pad 7 (uke)

on:
  workflow_dispatch:
    inputs:
      BUILD_TYPE:
        description: 'Build Type (Beta / Stable / Unofficial)'
        required: true
        default: 'Beta'
        type: choice
        options:
          - Beta
          - Stable
          - Unofficial
      FIXED_DECRYPT:
        description: 'Enable FBE Decryption (true/false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      UPLOAD_RELEASE:
        description: 'Upload to GitHub Releases'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      DEVICE: uke
      DT_LINK: https://github.com/${{ github.repository }}
      DT_BRANCH: ${{ github.ref_name }}
      DT_PATH: device/xiaomi/uke
      FOX_BRANCH: fox_14.1
      MANIFEST: https://gitlab.com/OrangeFox/sync.git
      TZ: Asia/Kolkata

    steps:
      # ──────────────────────────────────────────────
      # 1. Aggressively free disk space on the runner
      # ──────────────────────────────────────────────
      - name: Free disk space
        run: |
          echo "==> Disk space BEFORE cleanup:"
          df -h /
          # Remove large pre-installed toolchains (~30GB)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /opt/microsoft/msedge
          sudo rm -rf /opt/google/chrome
          sudo rm -rf /opt/pipx
          # Remove Docker images
          sudo docker image prune --all --force || true
          # Clean apt cache
          sudo apt-get clean
          sudo apt-get autoremove -y
          # Turn off any default runner swap and create a clean 16GB swap
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo fallocate -l 16G /mnt/primary_swap
          sudo chmod 600 /mnt/primary_swap
          sudo mkswap /mnt/primary_swap
          sudo swapon /mnt/primary_swap
          echo "==> Active Swap:"
          swapon --show
          echo "==> Disk space AFTER cleanup:"
          df -h /

      # ──────────────────────────────────────────────
      # 2. Install build dependencies
      # ──────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 repo openjdk-11-jdk
          sudo apt-get clean
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV

      # ──────────────────────────────────────────────
      # 3. Configure Git identity (required by repo)
      # ──────────────────────────────────────────────
      - name: Configure Git
        run: |
          git config --global user.name "OrangeFox CI"
          git config --global user.email "ci@orangefox.build"
          git config --global color.ui true

      # ──────────────────────────────────────────────
      # 4. Clone OrangeFox sync script & sync sources
      # ──────────────────────────────────────────────
      - name: Clone OrangeFox sync repo
        run: |
          cd ${{ github.workspace }}
          git clone https://gitlab.com/OrangeFox/sync.git OFSync
        working-directory: ${{ github.workspace }}

      - name: Sync OrangeFox sources
        run: |
          cd ${{ github.workspace }}/OFSync
          ./orangefox_sync.sh --branch 14.1 --path ${{ github.workspace }}/fox_14.1
        working-directory: ${{ github.workspace }}

      # ──────────────────────────────────────────────
      # 5. Clone device tree into the source tree
      # ──────────────────────────────────────────────
      - name: Clone device tree
        run: |
          cd ${{ github.workspace }}/fox_14.1
          git clone ${{ env.DT_LINK }} -b ${{ env.DT_BRANCH }} --depth=1 ${{ env.DT_PATH }}
        working-directory: ${{ github.workspace }}

      # ──────────────────────────────────────────────
      # 6. Set up ccache for faster rebuilds
      # ──────────────────────────────────────────────
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 8G
          key: ccache-orangefox-${{ env.DEVICE }}

      # ──────────────────────────────────────────────
      # 7. Export build flags
      # ──────────────────────────────────────────────
      - name: Set OrangeFox build vars
        run: |
          echo "FIXED_DECRYPT=${{ inputs.FIXED_DECRYPT }}" >> $GITHUB_ENV
          echo "FOX_BUILD_TYPE=${{ inputs.BUILD_TYPE }}" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
          echo "ALLOW_MISSING_DEPENDENCIES=true" >> $GITHUB_ENV
          echo "FOX_BUILD_DEVICE=${{ env.DEVICE }}" >> $GITHUB_ENV
          echo "LC_ALL=C" >> $GITHUB_ENV
          echo "GOGC=50" >> $GITHUB_ENV

      # ──────────────────────────────────────────────
      # 8. Build OrangeFox Recovery
      # ──────────────────────────────────────────────
      - name: Build OrangeFox Recovery
        run: |
          cd ${{ github.workspace }}/fox_14.1
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=${{ env.DEVICE }}
          export FIXED_DECRYPT=${{ inputs.FIXED_DECRYPT }}
          export GOGC=30
          export SOONG_UI_NUM_PARALLEL_JOBS=2
          lunch twrp_${{ env.DEVICE }}-ap2a-eng && mka -j2 recoveryimage
        working-directory: ${{ github.workspace }}

      # ──────────────────────────────────────────────
      # 9. Gather output files
      # ──────────────────────────────────────────────
      - name: Gather build output
        id: output
        run: |
          cd ${{ github.workspace }}/fox_14.1
          OUT_DIR="out/target/product/${{ env.DEVICE }}"
          echo "out_dir=${OUT_DIR}" >> $GITHUB_OUTPUT

          # Find the OrangeFox zip
          FOX_ZIP=$(find ${OUT_DIR} -maxdepth 1 -name "OrangeFox-*.zip" | head -1)
          if [ -z "$FOX_ZIP" ]; then
            echo "::error::OrangeFox zip not found!"
            exit 1
          fi
          echo "fox_zip=${FOX_ZIP}" >> $GITHUB_OUTPUT
          echo "fox_zip_name=$(basename ${FOX_ZIP})" >> $GITHUB_OUTPUT

          # Recovery image
          if [ -f "${OUT_DIR}/recovery.img" ]; then
            echo "recovery_img=${OUT_DIR}/recovery.img" >> $GITHUB_OUTPUT
          fi

          # Generate SHA256 checksums
          sha256sum ${FOX_ZIP} > ${FOX_ZIP}.sha256
          echo "sha256_file=${FOX_ZIP}.sha256" >> $GITHUB_OUTPUT

          # Build date for release tag
          echo "build_date=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
        working-directory: ${{ github.workspace }}

      # ──────────────────────────────────────────────
      # 10. Upload as workflow artifact (always)
      # ──────────────────────────────────────────────
      - name: Upload OrangeFox zip
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-${{ env.DEVICE }}-${{ steps.output.outputs.build_date }}
          path: |
            ${{ github.workspace }}/fox_14.1/${{ steps.output.outputs.fox_zip }}
            ${{ github.workspace }}/fox_14.1/${{ steps.output.outputs.sha256_file }}
          retention-days: 14

      - name: Upload recovery image
        if: steps.output.outputs.recovery_img != ''
        uses: actions/upload-artifact@v4
        with:
          name: recovery-img-${{ env.DEVICE }}-${{ steps.output.outputs.build_date }}
          path: ${{ github.workspace }}/fox_14.1/${{ steps.output.outputs.recovery_img }}
          retention-days: 14

      # ──────────────────────────────────────────────
      # 11. (Optional) Upload to GitHub Releases
      # ──────────────────────────────────────────────
      - name: Create GitHub Release
        if: inputs.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OrangeFox-${{ env.DEVICE }}-${{ steps.output.outputs.build_date }}
          name: "OrangeFox Recovery | ${{ env.DEVICE }} | ${{ inputs.BUILD_TYPE }} | ${{ steps.output.outputs.build_date }}"
          body: |
            ## OrangeFox Recovery for Xiaomi Pad 7 (uke)

            **Build Type:** ${{ inputs.BUILD_TYPE }}
            **FBE Decryption:** ${{ inputs.FIXED_DECRYPT }}
            **Branch:** ${{ env.FOX_BRANCH }}
            **Date:** ${{ steps.output.outputs.build_date }}
            **Maintainer:** azzychy

            ### Checksums
            See the `.sha256` file for verification.
          files: |
            ${{ github.workspace }}/fox_14.1/${{ steps.output.outputs.fox_zip }}
            ${{ github.workspace }}/fox_14.1/${{ steps.output.outputs.sha256_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
